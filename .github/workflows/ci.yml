name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build smoke
        run: python scripts/build_windows.py --build-root build-ci --output-root out-ci
      - name: Check exact artifact root
        run: |
          @'
          import zipfile
          from pathlib import Path
          zips = list(Path("out-ci").glob("Hermes-Session-Hub-Web-*.zip"))
          assert len(zips) == 1, zips
          with zipfile.ZipFile(zips[0]) as zf:
              assert sorted(zf.namelist()) == ["README-KO.txt", "Start.exe", "Stop.exe", "VERSION"], zf.namelist()
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-session-hub-web-preview
          path: out-ci/
